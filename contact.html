<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Bitloop Lab</title>
  <meta name="description" content="Get in touch with Bitloop Lab to start your Android app or website project.">
  <meta name="theme-color" content="#6c5cff">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try{var t=localStorage.getItem("bl-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> / Contact</div>
        <h1>Let's build <span class="gradient-text">something great</span></h1>
        <p>Tell us about your app or website idea. We'll reply with a plan, timeline and estimate.</p>
      </div>
    </section>

    <section style="padding-top:30px">
      <div class="container contact-grid">
        <div class="card reveal">
          <h3 style="margin-bottom:24px">Get in touch</h3>
          <!-- Filled from assets/js/data.js -->
          <div id="contactInfo"></div>
        </div>

        <div class="card reveal">
          <form class="form" id="contactForm" novalidate>
            <div class="form-row">
              <div class="field">
                <label for="name">Your name *</label>
                <input id="name" name="name" type="text" autocomplete="name" placeholder="Jane Doe" required>
                <span class="error"></span>
              </div>
              <div class="field">
                <label for="email">Email *</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                <span class="error"></span>
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label for="service">Service *</label>
                <select id="service" name="service" required>
                  <option value="">Choose a service</option>
                  <option>Android App</option>
                  <option>Website</option>
                  <option>Android App + Website</option>
                  <option>UI/UX Design</option>
                  <option>Maintenance</option>
                  <option>Other</option>
                </select>
                <span class="error"></span>
              </div>
              <div class="field">
                <label for="budget">Budget (optional)</label>
                <select id="budget" name="budget">
                  <option value="">Not sure yet</option>
                  <option>Small</option>
                  <option>Medium</option>
                  <option>Large</option>
                </select>
                <span class="error"></span>
              </div>
            </div>
            <div class="field">
              <label for="message">Project details *</label>
              <textarea id="message" name="message" placeholder="Tell us about your idea, features you need and your timeline…" required></textarea>
              <span class="error"></span>
            </div>
            <button type="submit" class="btn btn-primary" style="justify-self:start">Send message →</button>
            <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
