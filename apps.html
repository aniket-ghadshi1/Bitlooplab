<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Apps — Bitloop Lab</title>
  <meta name="description" content="Android apps and websites built by Bitloop Lab.">
  <link rel="canonical" href="https://bitlooplab.co.in/apps.html">
  <meta property="og:url" content="https://bitlooplab.co.in/apps.html">
  <meta property="og:site_name" content="Bitloop Lab">
  <meta name="theme-color" content="#6c5cff">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try{var t=localStorage.getItem("bl-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body data-page="apps">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> / Our Apps</div>
        <h1>Our <span class="gradient-text">Apps &amp; Projects</span></h1>
        <p>Android apps and websites designed and built by the Bitloop Lab team.</p>
      </div>
    </section>

    <section style="padding-top:30px">
      <div class="container">
        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filter projects">
            <button class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-btn" data-filter="android" aria-pressed="false">Android Apps</button>
            <button class="filter-btn" data-filter="web" aria-pressed="false">Websites</button>
          </div>
          <input type="search" class="search" id="appSearch" placeholder="Search apps…" aria-label="Search apps">
        </div>
        <p class="rating" id="appCount" aria-live="polite" style="margin-bottom:18px"></p>
        <!-- Cards are rendered from assets/js/data.js -->
        <div class="grid grid-3" id="appsGrid"></div>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="cta-box reveal">
          <h2>Want your app featured here?</h2>
          <p>Let's build your next Android app or website together.</p>
          <a href="contact.html" class="btn">Start a project →</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
